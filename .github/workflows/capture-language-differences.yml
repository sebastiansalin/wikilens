name: Capture top 100 language differences
on:
  push:
    branches: [feature/language-differences-tab]
    paths: [pipeline/capture-top-languages.mjs, pipeline/top-language-selection.mjs, .github/workflows/capture-language-differences.yml]
permissions:
  contents: write
concurrency:
  group: capture-top-languages
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/language-neighborhood.test.mjs tests/top-language-selection.test.mjs
      - run: node pipeline/capture-top-languages.mjs
      - name: Publish captured sources on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/language-differences
          git diff --cached --quiet && exit 0
          git commit -m 'data: capture top 100 language differences with source evidence'
          git push origin HEAD:feature/language-differences-tab
